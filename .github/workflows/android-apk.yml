name: 安卓 APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 安装 Gradle 8.7（AGP 8.5.2 要求）
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7
        working-directory: android

      - uses: android-actions/setup-android@v3
        with:
          # v3 默认会去装已废弃的 'tools' 包，新版 runner SDK 已移除该包 → sdkmanager 退出码1。
          # 显式指定 packages 跳过 'tools'，预装 compileSdk 34 平台 + build-tools + platform-tools。
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: 构建 Release APK
        run: |
          cd android
          gradle assembleRelease --no-daemon
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)"/\1/p' app/build.gradle | head -n 1)
          test -n "$VERSION"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/AutoSign-${VERSION}-release.apk"

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find dist -maxdepth 1 -type f -name 'AutoSign-*-release.apk' -print -quit)
          test -n "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AutoSign $GITHUB_REF_NAME" \
            --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: justsign-android-apk
          path: dist/*.apk
          if-no-files-found: error
