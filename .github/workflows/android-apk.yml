name: 安卓 APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 安装 Gradle 8.7（AGP 8.5.2 要求）
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7
        working-directory: android

      - uses: android-actions/setup-android@v3
        with:
          # v3 默认会去装已废弃的 'tools' 包，新版 runner SDK 已移除该包 → sdkmanager 退出码1。
          # 显式指定 packages 跳过 'tools'，预装 compileSdk 34 平台 + build-tools + platform-tools。
          cmdline-tools-version: "latest"
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: 构建 Debug APK（debug 签名，下载即可安装）
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: justsign-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
