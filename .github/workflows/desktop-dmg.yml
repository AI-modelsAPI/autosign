name: 桌面端 DMG（macOS Intel x64）

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  dmg-x64:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 拷贝引擎源码（src 与 electron 同为打包素材）
        run: cp -r ../src ./src

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 打包 Intel DMG（免签名，可直接安装）
        run: npx electron-builder --mac --x64

      - uses: actions/upload-artifact@v4
        with:
          name: justsign-macos-intel-dmg
          path: electron/dist/*.dmg
          if-no-files-found: error
